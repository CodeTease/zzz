[package]
name = "zzzsleep"
version = "0.1.0"
edition = "2024"
description = "A fancy sleep command written in Rust 💤"
license = "MIT"
keywords = ["sleep", "timer", "pomodoro", "progress", "cli"]
categories = ["command-line-utilities", "multimedia"]
readme = "README.md"
homepage = "https://github.com/username/zzz"
repository = "https://github.com/username/zzz"
documentation = "https://docs.rs/zzz"

[[bin]]
name = "zzz"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.18"
humantime = "2.1"
signal-hook = "0.4"
crossterm = "0.29"
chrono = "0.4"
libc = "0.2"
sysinfo = "0.33" # Downgrade to 0.33 to build on older toolchains

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }
ctrlc = "3.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
