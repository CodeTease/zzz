[package]
name = "zzz"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
humantime = "2.1"
signal-hook = "0.4"
crossterm = "0.29"
chrono = "0.4"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

